nodeLinker: node-modules

# Advisories the frontends' `audit` task (yarn npm audit) accepts, by npm
# advisory ID: Yarn doesn't match GHSA IDs. Only for advisories that no
# release fixes yet; drop an entry once one does.
npmAuditIgnoreAdvisories:
  # deepmerge <= 4.3.1 prototype poisoning (GHSA-gcqx-w48m-w2h4, low): 4.3.1 is
  # the last release and has no fix. Its only dependent, the latest
  # @rollup/plugin-node-resolve (16.0.3, via workbox-build in vite-plugin-pwa),
  # merges nothing but its own frozen defaults, at build time.
  - '1243505'
