dependsOn:
  - css-core
  - typescript-applications
  - typescript-constants
  - vite-ssg
  - vue-applications
  - vue-color-scheme
  - vue-components-core
  - vue-components-extra
  - vue-components-website
  - vue-drawio-core
  - vue-i18n
  - vue-icons
  - vue-layouts
  - vue-router-configs
  - vue-sustainable-development-goals
  - vue-unhead-composables

env:
  PRODUCTION_HOST: 'lychen.org'
  STAGING_HOST: 'staging.lychen.org'

id: website

language: typescript

layer: application

stack: frontend

tags:
  - ssg
  - asset
  - docker
  - dokploy

tasks:
  assets-sync:
    deps:
      - args: '$projectRoot/public/fonts'
        target: assets-fonts:create-symlink-on-content
      - args: '$projectRoot/public/vara'
        target: assets-vara:create-symlink-on-content
      - args: '$projectRoot/public/humu'
        target: assets-humu:create-symlink-on-content
      - args: '$projectRoot/public/myko'
        target: assets-myko:create-symlink-on-content
      - args: '$projectRoot/public/kiro'
        target: assets-kiro:create-symlink-on-content
      - args: '$projectRoot/public/kolo'
        target: assets-kolo:create-symlink-on-content
      - args: '$projectRoot/public/novi'
        target: assets-novi:create-symlink-on-content
      - args: '$projectRoot/public/robust'
        target: assets-robust:create-symlink-on-content
      - args: '$projectRoot/public/meli'
        target: assets-meli:create-symlink-on-content
      - args: '$projectRoot/public/tera'
        target: assets-tera:create-symlink-on-content
      - args: '$projectRoot/public/sustainable-development-goals'
        target: assets-sustainable-development-goals:create-symlink-on-content

  build:
    deps:
      - assets-sync

  dev:
    deps:
      - assets-sync
