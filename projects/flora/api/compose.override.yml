# Development environment override
# Pin the compose project name: every API lives in a directory called `api`, so
# without this a bare `docker compose` (or `make up`) derives the project name
# from that directory and all APIs collide on the same containers and volumes.
# Moon tasks pass `-p $project`, which resolves to this same value.
name: flora-api
services:
  database:
    ports:
      - '21432:5432/tcp'
    networks:
      - lychen-network

  api:
    build:
      context: .
      target: frankenphp_dev
    environment:
      SERVER_NAME: api.flora.lychen.local, api:80
      XDEBUG_MODE: '${XDEBUG_MODE:-off}'
    extra_hosts:
      - host.docker.internal:host-gateway
    tty: true
    volumes:
      - ./:/app
      #- ./var:/app/var
      - ./frankenphp/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
    ports:
      - protocol: tcp
        published: ${HTTP_PORT:-8080}
        target: 80
      - protocol: tcp
        published: ${HTTPS_PORT:-30443}
        target: 443
      - protocol: udp
        published: ${HTTP3_PORT:-40443}
        target: 443
    networks:
      - lychen-network

  redis:
    networks:
      - lychen-network

  # SQL Server behind the `sqlserver` Doctrine connection. Dev only: compose.yml
  # (CI, staging, production) runs none, so staging and production point
  # SQLSERVER_DATABASE_URL at their own server from the Dokploy compose.
  sqlserver:
    environment:
      ACCEPT_EULA: 'Y'
      # Read by the healthcheck only, the image itself has no database setting.
      MSSQL_DB: ${MSSQL_DB:-app}
      MSSQL_MEMORY_LIMIT_MB: ${MSSQL_MEMORY_LIMIT_MB:-2048}
      # Free and complete, but not licensed for production.
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-PasswordForLocal!}
    healthcheck:
      # Unlike Postgres' POSTGRES_DB, the image never creates the application
      # database: the check does, idempotently, so healthy means it exists.
      retries: 5
      start_period: 60s
      test: [ 'CMD-SHELL', '/opt/mssql-tools18/bin/sqlcmd -C -b -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -Q "IF DB_ID(N''$${MSSQL_DB}'') IS NULL CREATE DATABASE [$${MSSQL_DB}]"' ]
      timeout: 10s
    image: mcr.microsoft.com/mssql/server:${MSSQL_VERSION:-2025}-latest
    networks:
      - lychen-network
    # Microsoft publishes amd64 images only: on Apple silicon, Docker Desktop
    # runs it through Rosetta.
    platform: linux/amd64
    ports:
      - '21433:1433/tcp'
    volumes:
      - sqlserver_data:/var/opt/mssql

networks:
  lychen-network:
    external: true

volumes:
  sqlserver_data:
