# Development environment override
# Pin the compose project name: every API lives in a directory called `api`, so
# without this a bare `docker compose` (or `make up`) derives the project name
# from that directory and all APIs collide on the same containers and volumes.
# Moon tasks pass `-p $project`, which resolves to this same value.
name: flora-api
services:
  database:
    ports:
      - '21432:5432/tcp'

  api:
    build: &dev-build
      context: .
      # The Dockerfile of every API (libs/docker/symfony): drop dockerfile and
      # the docker-symfony context for a Dockerfile of the API's own, at its
      # root. That context is never used: it only lets compose (bake) read a
      # Dockerfile from outside the build context. caddy-config holds the
      # Caddyfiles of every API, which the Dockerfile copies (libs/caddy).
      dockerfile: ../../../libs/docker/symfony/Dockerfile
      additional_contexts:
        caddy-config: ../../../libs/caddy/symfony
        docker-symfony: ../../../libs/docker/symfony
      target: frankenphp_dev
    environment:
      SERVER_NAME: api.flora.lychen.local, api:80
      XDEBUG_MODE: '${XDEBUG_MODE:-off}'
    extra_hosts:
      - host.docker.internal:host-gateway
    tty: true
    volumes:
      - ./:/app
      #- ./var:/app/var
      # The shared Caddyfile (libs/caddy/symfony) and what flora adds to it, read
      # at start: a change needs a restart, not a rebuild. An API with a
      # Caddyfile of its own mounts ./frankenphp/Caddyfile instead.
      - ../../../libs/caddy/symfony/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frankenphp/Caddyfile.d:/etc/caddy/Caddyfile.d:ro
      - ./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
    ports:
      - protocol: tcp
        published: ${HTTP_PORT:-8080}
        target: 80
      - protocol: tcp
        published: ${HTTPS_PORT:-30443}
        target: 443
      - protocol: udp
        published: ${HTTP3_PORT:-40443}
        target: 443
    networks: &dev-networks
      # `default` is kept explicitly: naming any network opts a service out
      # of the implicit one, which would cut the API off from its own
      # database and redis. Only the PHP processes (`api`, and the `worker`
      # and `outbox-relay` below) join the shared network — database and
      # redis keep private, non-colliding names on the stack's own.
      - default
      - lychen-network

  # The event bus processes run the dev image on the mounted sources: restart
  # them (`docker compose -p flora-api restart worker outbox-relay`) to pick up
  # a code change.
  worker:
    build: *dev-build
    networks: *dev-networks
    volumes: &dev-volumes
      - ./:/app
      - ./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro

  outbox-relay:
    build: *dev-build
    networks: *dev-networks
    volumes: *dev-volumes

networks:
  lychen-network:
    external: true
