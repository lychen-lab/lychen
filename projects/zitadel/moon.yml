id: zitadel
language: bash
layer: application
stack: backend
tags:
  - dokploy
tasks:
  # Provision default clients against a TARGET instance. Set ZITADEL_API_URL +
  # ZITADEL_PAT (e.g. in .env.local). Use for a fresh staging/production
  # instance — never against dev, which already holds its clients.
  provision:
    command: node provisioning/provision.mjs
    options:
      cache: false
      runInCI: false
