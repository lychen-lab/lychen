dependsOn:
  - css-core
  - typescript-utils
  - vue-components-business
  - vue-components-core
  - vue-components-extra
  - vue-i18n
  - vue-icons
id: storybook
language: typescript
layer: application
stack: frontend
tasks:
  build:
    command: yarn build
    deps:
      - args:
          - $projectRoot/.nginx-build
        target: nginx-configs:sync-ssg
    options:
      cache: false
  dev:
    command: yarn dev
    options:
      persistent: true
