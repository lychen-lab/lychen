# Which events reach which service: the bindings of the services' queues on the
# platform's topic exchange (lychen.events).
#
# One subscription per line: the subscribing service, then a binding key. An
# event's routing key is its type, `<domain>.<aggregate>.<action>.v<n>`. Bind
# the exact type of each event the service handles, so that a new event, or a
# new version of one, reaches no service before it can read it. A wildcard
# (`*` one word, `#` any number) works too, but delivers every matching event:
# those the service declares no class for are acknowledged with a warning.
#
# A service always receives its own background work (`<service>.internal.#`),
# and never its own events unless it subscribes to them here.
#
# entrypoint.sh reads this file at boot, so a change takes effect when the
# broker restarts. Removing a line does not unbind a broker that already has the
# binding: delete it from the management UI (Queues > <service>.events >
# Bindings).

# tera adds the seeds a flora seed library gives to a member to their stock.
tera flora.seed_lot.given.v1
