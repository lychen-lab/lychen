# Central message broker, shared by every API over the `lychen-network`, the same
# way `common/mailpit` is shared.
#
# One vhost, one durable topic exchange (`lychen.events`), and one queue per
# service bound to the routing keys it subscribes to — see `entrypoint.sh` for
# the whole topology, which it renders into a definitions file at boot. Set
# `RABBITMQ_<SERVICE>_PASSWORD` per environment, and add a domain to
# `RABBITMQ_SERVICES` to give it a user, a queue, a dead-letter queue and its
# bindings — in the environment only, nothing here needs editing.
#
# Dev-only bits (published ports, `lychen-network`) live in compose.override.yml,
# so this file stays deployable as-is to staging and production via Dokploy.
services:
  rabbitmq:
    # `entrypoint` resets `command` under the Compose spec, so the image's own
    # default command has to be restated here.
    command: rabbitmq-server
    entrypoint: /usr/local/bin/lychen-entrypoint.sh
    # The whole environment, not a list of variables: entrypoint.sh reads a
    # `RABBITMQ_<SERVICE>_PASSWORD` and `_BINDING_KEYS` for each entry of
    # `RABBITMQ_SERVICES`, and `environment:` can only forward names it spells
    # out — any other service silently booted with its dev password. Dokploy
    # writes the compose's env to a `.env` next to this file (and injects none of
    # it by itself). Locally there is none, and every variable falls back to its
    # dev default in entrypoint.sh.
    env_file:
      - path: .env
        required: false
    healthcheck:
      retries: 5
      start_period: 30s
      test: [ 'CMD', 'rabbitmq-diagnostics', '-q', 'ping' ]
      timeout: 10s
    image: rabbitmq:${RABBITMQ_VERSION:-4.0.4}-management-alpine
    restart: unless-stopped
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq/
      - ./entrypoint.sh:/usr/local/bin/lychen-entrypoint.sh:ro
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro

volumes:
  rabbitmq_data:
