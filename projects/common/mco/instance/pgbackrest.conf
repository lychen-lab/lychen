# pgBackRest, shared by every instance and mounted at its default path: the
# restore_command that pgBackRest writes on a restore names no --config.
#
# Everything specific to an instance comes from the environment of its
# containers (PGBACKREST_STANZA, PGBACKREST_PG1_PATH, _PG1_SOCKET_PATH, _PG1_USER):
# pg1-* are stanza options, which pgBackRest refuses in [global]. The cipher pass
# also comes from the environment (PGBACKREST_REPO1_CIPHER_PASS), never from a file.
#
# One repository for every instance (the external volume
# lychen-mco-pgbackrest-repo), one stanza per domain.
[global]
repo1-path=/var/lib/pgbackrest
repo1-retention-full=2
repo1-cipher-type=aes-256-cbc
compress-type=zst
start-fast=y
process-max=2
log-level-console=info
log-level-file=off
