# Development environment override
# Pin the compose project name: every API lives in a directory called `api`, so
# without this a bare `docker compose` (or `make up`) derives the project name
# from that directory and all APIs collide on the same containers and volumes.
# Moon tasks pass `-p $project`, which resolves to this same value.
name: espace-api
services:
    database:
        ports:
            - "19432:5432/tcp"
    api:
        build:
            context: .
            target: frankenphp_dev
        environment:
            SERVER_NAME: api.espace.lychen.local
            #MERCURE_EXTRA_DIRECTIVES: demo
            # See https://xdebug.org/docs/all_settings#mode
            XDEBUG_MODE: "${XDEBUG_MODE:-off}"
        extra_hosts:
            # Ensure that host.docker.internal is correctly defined on Linux
            - host.docker.internal:host-gateway
        tty: true
        volumes:
            - ./:/app
            #- ./var:/app/var
            - ./frankenphp/Caddyfile:/etc/caddy/Caddyfile:ro
            - ./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
        ports:
            - protocol: tcp
              published: ${HTTP_PORT:-8089}
              target: 80
            - protocol: tcp
              published: ${HTTPS_PORT:-19443}
              target: 443
            - protocol: udp
              published: ${HTTP3_PORT:-29443}
              target: 443
