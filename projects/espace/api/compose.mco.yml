# MCO mode of the espace API (PostgreSQL MCO POC, local only), on top of
# compose.yml + compose.override.yml: `moon espace-api:mco-up` / `mco-down`.
# The services come from projects/common/mco/compose.instance.yml; this file only
# adds what is espace's own. See projects/common/mco/README.md.
#
# The MCO image is Debian, the usual database Alpine: they never share a volume
# (musl and glibc sort text differently). `database_data` is left untouched, and
# the API's entrypoint runs the Doctrine migrations on the fresh one.
services:
    database:
        extends:
            file: ../../common/mco/compose.instance.yml
            service: database
        environment:
            PGBACKREST_PG1_USER: ${POSTGRES_USER:-userlocal}
            PGBACKREST_STANZA: espace
        networks:
            # Naming a network opts out of the implicit `default`, which the API
            # reaches its database on.
            default: {}
            # The MCO tools reach it there under its alias, never as `database`
            # (every stack has one). The API stays off this network.
            lychen-mco:
                aliases:
                    - espace-database
        # Replaces the API's own mounts instead of adding to them: its
        # `database_data` must never be mounted in MCO mode, whatever its target
        # (/var/lib/postgresql/data on PostgreSQL 16, /var/lib/postgresql on 18).
        volumes: !override
            # PostgreSQL 18+ layout: the data lives in 18/docker under this mount.
            - database_data_mco_pg18:/var/lib/postgresql
            - database_socket_mco:/var/run/postgresql
            - pgbackrest_repo:/var/lib/pgbackrest
            # The default path: pgBackRest's restore_command names no --config.
            - ../../common/mco/instance/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro

    mco-init:
        depends_on:
            database:
                condition: service_healthy
        environment:
            MCO_SERVER_ALIAS: espace
            PGDATABASE: ${POSTGRES_DB:-app}
            PGHOST: espace-database
            PGPASSWORD: ${POSTGRES_PASSWORD:-PasswordForLocal!}
            PGUSER: ${POSTGRES_USER:-userlocal}
        extends:
            file: ../../common/mco/compose.instance.yml
            service: mco-init
        networks:
            - lychen-mco

    mco-pgbackrest:
        depends_on:
            database:
                condition: service_healthy
        environment:
            MCO_RESTORE_CHECK_DB: ${POSTGRES_DB:-app}
            PGBACKREST_PG1_USER: ${POSTGRES_USER:-userlocal}
            PGBACKREST_STANZA: espace
        extends:
            file: ../../common/mco/compose.instance.yml
            service: mco-pgbackrest
        # The data directory, the socket, the repository and pgbackrest.conf.
        volumes_from:
            - database

volumes:
    database_data_mco_pg18:
    database_socket_mco:
    pgbackrest_repo:
        external: true
        name: lychen-mco-pgbackrest-repo

networks:
    lychen-mco:
        external: true
