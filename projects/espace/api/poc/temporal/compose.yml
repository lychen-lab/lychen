# Self-contained Temporal stack for the POC.
#   docker compose up -d        # Temporal server + UI + Postgres
#   docker compose up worker    # the PHP/RoadRunner worker
# Temporal UI: http://localhost:8233
services:
    temporal-postgres:
        image: postgres:16-alpine
        environment:
            - POSTGRES_USER=temporal
            - POSTGRES_PASSWORD=temporal
        volumes:
            - temporal_pg:/var/lib/postgresql/data:rw

    temporal:
        image: temporalio/auto-setup:1.25.2
        depends_on:
            - temporal-postgres
        environment:
            - DB=postgres12
            - DB_PORT=5432
            - POSTGRES_USER=temporal
            - POSTGRES_PWD=temporal
            - POSTGRES_SEEDS=temporal-postgres
        ports:
            - "7233:7233"

    temporal-ui:
        image: temporalio/ui:2.31.2
        depends_on:
            - temporal
        environment:
            - TEMPORAL_ADDRESS=temporal:7233
            - TEMPORAL_CORS_ORIGINS=http://localhost:8233
        ports:
            - "8233:8080"

    worker:
        build:
            context: .
            dockerfile: Dockerfile
        depends_on:
            - temporal
        environment:
            - TEMPORAL_ADDRESS=temporal:7233
        restart: unless-stopped

volumes:
    temporal_pg:
