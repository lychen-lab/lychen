dependsOn:
  - css-core
  - typescript-espace-api-sdk
  - typescript-zitadel
  - vue-color-scheme
  - vue-components-app
  - vue-components-business
  - vue-components-core
  - vue-components-extra
  - vue-espace
  - vue-i18n
  - vue-icons
  - vue-layouts
env:
  HOST: ${ESPACE_APP_HOST}
id: espace-app
language: typescript
layer: application
stack: frontend
tags:
  - pwa
  - asset
  - docker
  - dokploy
tasks:
  assets-sync:
    deps:
      - args:
          - $projectRoot/public/fonts
        target: assets-fonts:create-symlink-on-content
  build:
    deps:
      - assets-sync
  dev:
    deps:
      - assets-sync
