# The front's only access to tera-api: one Tanstack Query composable per endpoint, in
# endpoint/<resource>/<endpoint>/ with its own mapping (mapToModel, mapToRequest)
# between the SDK's types and the front's business model (libs/typescript/front-model-business).
dependsOn:
  - typescript-api-client
  - typescript-api-mapping
  - typescript-front-model-business
  - typescript-tera-api-sdk
  - typescript-zitadel
  - vue-api-query
id: vue-tera-api
language: typescript
layer: library
# Inherits lint, format, typecheck and test from .moon/tasks/frontend.yml.
stack: frontend
