# The front's only access to espace-api: one Tanstack Query composable per endpoint, in
# endpoint/<resource>/use-<endpoint>/ with its own mapping (mapToModel, mapToRequest)
# between the SDK's types and the front's models (libs/typescript/espace-models).
dependsOn:
  - typescript-api-client
  - typescript-api-mapping
  - typescript-espace-api-sdk
  - typescript-espace-models
  - typescript-zitadel
  - vue-api-query
id: vue-espace-api
language: typescript
layer: library
# Inherits lint, format, typecheck and test from .moon/tasks/frontend.yml.
stack: frontend
