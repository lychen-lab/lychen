id: caddy-configs
language: unknown
layer: library
tasks:
  # Each task copies the content of a config folder (the trailing /.) into the
  # folder given as argument. Copying the folder itself only works the first
  # time: once the destination exists, cp nests it there (.caddy-build/ssg/)
  # and the image keeps the Caddyfile of the first build.
  sync-pwa:
    command:
    - yes
    - '|'
    - cp
    - -rf
    - $projectRoot/pwa/.
    inputs:
    - $projectRoot/pwa/
    options:
      cache: false
  sync-ssg:
    command:
    - yes
    - '|'
    - cp
    - -rf
    - $projectRoot/ssg/.
    inputs:
    - $projectRoot/ssg/
    options:
      cache: false
