$schema: https://moonrepo.dev/schemas/tasks.json
# Local tasks of the Symfony APIs. The CI-only ones live in symfony-ci.yml, and
# extend the tasks below when they run the same command.
inheritedBy:
  tag: symfony
tasks:
  dev:
    # Extends tag-compose's `dev` (a shortcut to `up`): moon appends these deps
    # to the inherited ones, so an API's dev also brings up the shared services.
    deps:
      - common-mailpit:up
      - common-mercure:up
      - common-rabbitmq:up
  export-openapi:
    # Export the default OpenAPI version (3.1). Do not pass --spec-version=3.0.0:
    # API Platform's 3.0 compatibility path drops the operations' serializer
    # groups, so every operation of a resource collapses into a single schema
    # and the generated TypeScript SDKs lose fields (e.g. a collection's `state`).
    command: docker compose -p $project run --rm api bin/console api:openapi:export --output=openapi_docs.json
  install-tools:
    command: docker compose -p $project run --rm api composer install --no-interaction --working-dir=tools/
  php-cs-fixer-fix:
    command: docker compose -p $project run --rm api tools/vendor/bin/php-cs-fixer fix
    deps:
      - install-tools
  phpstan:
    # Errors listed in phpstan-baseline.neon are known debt. Fixing one means
    # deleting its entry; never regenerate the baseline to absorb new errors (CI
    # rejects a baseline that grows).
    command: docker compose -p $project run --rm api tools/vendor/bin/phpstan analyse --memory-limit=-1
    deps:
      - install-tools
  load-fixtures:
    command: docker compose -p $project run --rm api bin/console do:fi:lo -n
  test-phpunit:
    command: docker compose -p $project run --rm api php -d memory_limit=-1 ./vendor/bin/phpunit
