$schema: https://moonrepo.dev/schemas/tasks.json
inheritedBy:
  tag: compose
tasks:
  dev:
    # Shortcut to `up`, so `moon <project>:dev` works for compose stacks too.
    deps:
    - up
  down:
    command: docker compose -p $project down
  up:
    command: docker compose -p $project up -d
    deps:
    - common-network:create-network
