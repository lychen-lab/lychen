$schema: https://moonrepo.dev/schemas/tasks.json
# The project's production image, built from the Dockerfile at its root and
# published as ghcr.io/lychen-lab/lychen/<project>. What a stack's build needs
# first is added to these tasks, in the same-id tasks of a file inherited by
# that stack only: frontend-docker.yml, symfony-docker.yml.
inheritedBy:
  tag: docker
tasks:
  docker-build:
    # The image for the runner's platform only, to check that it builds.
    # docker-push builds and pushes the multi-platform one.
    command: docker buildx build $projectRoot --cache-from type=registry,ref=${IMAGE_NAME}:buildcache --build-arg GIT_SHA=${GITHUB_SHA}
    env: &image-name
      IMAGE_NAME: ghcr.io/lychen-lab/lychen/$project
    options:
      cache: false
  docker-push:
    # The layer cache lives in its own registry tag (:buildcache), exported with
    # mode=max so the layers of every stage are reused — including the arm64
    # ones built under QEMU, the slow part of an API build. Pushing an image
    # does not export any cache by itself: `--cache-from :latest` alone never
    # hit.
    command: docker buildx build $projectRoot --cache-from type=registry,ref=${IMAGE_NAME}:buildcache --cache-to type=registry,ref=${IMAGE_NAME}:buildcache,mode=max --platform linux/arm64,linux/amd64 --build-arg GIT_SHA=${GITHUB_SHA} -t ${IMAGE_NAME}:latest -t ${IMAGE_NAME}:${GITHUB_SHA} --push
    env: *image-name
    options:
      cache: false
