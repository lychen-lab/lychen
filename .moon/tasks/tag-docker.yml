$schema: https://moonrepo.dev/schemas/tasks.json
inheritedBy:
  tag: docker
tasks:
  docker-buildx:
    command: docker buildx build $projectRoot --platform linux/arm64,linux/amd64 --build-arg BUILDKIT_INLINE_CACHE=1 --cache-from ${IMAGE_NAME}:latest --tag ${IMAGE_NAME}:${GITHUB_SHA} --tag ${IMAGE_NAME}:latest --push
    deps:
    - build
    - get-dockerfiles
    env:
      IMAGE_NAME: ghcr.io/lychen-lab/lychen/$project
    options:
      cache: false
  image-promote:
    # Re-tag the current :latest manifest as :${VERSION} (+ :stable), registry-side
    # (no rebuild, no layer transfer). VERSION is forwarded from the host env, the
    # same way ${GITHUB_SHA} is in docker-buildx. Run via `moon run` (not `moon ci`).
    command: docker buildx imagetools create -t ${IMAGE_NAME}:${VERSION} -t ${IMAGE_NAME}:stable ${IMAGE_NAME}:latest
    env:
      IMAGE_NAME: ghcr.io/lychen-lab/lychen/$project
    options:
      cache: false
  docker-test-build:
    command: docker build $projectRoot --build-arg BUILDKIT_INLINE_CACHE=1 --cache-from ${IMAGE_NAME}:latest
    deps:
    - build
    - get-dockerfiles
    env:
      IMAGE_NAME: ghcr.io/lychen-lab/lychen/$project
    options:
      cache: false
  get-dockerfiles:
    options:
      cache: false
    script: cp -R $workspaceRoot/libs/docker/frontend/* .
