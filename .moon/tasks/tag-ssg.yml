$schema: https://moonrepo.dev/schemas/tasks.json
# The Caddyfile the image of an SSG frontend serves it with, unless the frontend
# has its own (.moon/scripts/docker-buildx.sh, libs/caddy/README.md). A
# file-level env reaches every task of the project, docker-build and docker-push
# included. The frontend lists caddy-ssg in its dependsOn, so that a change to
# it redeploys the frontend.
env:
  SHARED_CADDY_CONFIG: $workspaceRoot/libs/caddy/ssg
inheritedBy:
  tag: ssg
tasks:
  build:
    command: yarn build
    inputs:
    - .env*
    - index.html
    - package.json
    - public/**/*
    - src/**/*
    - tsconfig.json
    - vite.config.ts
    - /libs/css/**/*
    - /libs/drawio/**/*
    - /libs/i18n/**/*
    - /libs/typescript/**/*
    - /libs/vite/**/*
    - /libs/vue/**/*
    - /yarn.lock
    - project://^
    - $APP_ID
    - $ESPACE_WEBSITE_HOST
    - $HOST
    - $VITE_*
    outputs:
    - dist
  dev:
    command: yarn dev
    env:
      VITE_APP_ID: $project
      VITE_UNHEAD_HOST: ${HOST}
    options:
      persistent: true
