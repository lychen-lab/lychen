$schema: https://moonrepo.dev/schemas/tasks.json
inheritedBy:
  tag: dokploy
tasks:
  dokploy-compose-deploy:
    command: bash $workspaceRoot/.moon/scripts/dokploy-compose-deploy.sh
    options:
      inferInputs: false
  image-promote:
    # Re-tag the current :latest manifest as :${VERSION} (+ :stable), registry-side
    # (no rebuild, no layer transfer). VERSION is forwarded from the host env, the
    # same way ${GITHUB_SHA} is in docker-buildx. Run via `moon run` (not `moon ci`).
    #
    # Defined once here (inherited by every `dokploy` project) now that fronts and
    # APIs share the single `ghcr.io/lychen-lab/lychen/<project>` namespace, instead
    # of being duplicated per layer in tag-docker.yml / tag-symfony.yml.
    command: docker buildx imagetools create -t ${IMAGE_NAME}:${VERSION} -t ${IMAGE_NAME}:stable ${IMAGE_NAME}:latest
    env:
      IMAGE_NAME: ghcr.io/lychen-lab/lychen/$project
    options:
      cache: false
