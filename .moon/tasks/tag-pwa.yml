$schema: https://moonrepo.dev/schemas/tasks.json
# The Caddyfile the image of a PWA frontend serves it with, unless the frontend
# has its own (.moon/scripts/docker-buildx.sh, libs/caddy/README.md). A
# file-level env reaches every task of the project, docker-build and docker-push
# included. The frontend lists caddy-pwa in its dependsOn, so that a change to
# it redeploys the frontend.
env:
  SHARED_CADDY_CONFIG: $workspaceRoot/libs/caddy/pwa
tasks:
  build:
    command: yarn build
    inputs:
    - .env*
    - index.html
    - package.json
    - public/**/*
    - src/**/*
    - tsconfig.json
    - vite.config.ts
    - /libs/css/**/*
    - /libs/drawio/**/*
    - /libs/i18n/**/*
    - /libs/typescript/**/*
    - /libs/vite/**/*
    - /libs/vue/**/*
    - /yarn.lock
    - project://^
    - $APP_ID
    - $ESPACE_API_HOST
    - $HOST
    - $VITE_*
    - $ZITADEL_CLIENT_ID
    - $ZITADEL_ISSUER
    - $ZITADEL_PROJECT_RESOURCE_ID
    outputs:
    - dist
  dev:
    command: yarn dev
    options:
      persistent: true
  generate-pwa-assets:
    command: yarn generate-pwa-assets
    deps:
    - assets-sync
inheritedBy:
  tag: pwa
