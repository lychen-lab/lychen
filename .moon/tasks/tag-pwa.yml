$schema: https://moonrepo.dev/schemas/tasks.json
tasks:
  build:
    command: yarn build
    deps:
    - args:
      - $projectRoot/.caddy-build
      target: caddy-configs:sync-pwa
    inputs:
    - .env*
    - index.html
    - package.json
    - public/**/*
    - src/**/*
    - tsconfig.json
    - vite.config.ts
    - /libs/css/**/*
    - /libs/drawio/**/*
    - /libs/i18n/**/*
    - /libs/typescript/**/*
    - /libs/vite/**/*
    - /libs/vue/**/*
    - /yarn.lock
    - project://^
    - $APP_ID
    - $ESPACE_API_HOST
    - $HOST
    - $VITE_*
    - $ZITADEL_CLIENT_ID
    - $ZITADEL_ISSUER
    - $ZITADEL_PROJECT_RESOURCE_ID
    outputs:
    - dist
  dev:
    command: yarn dev
    options:
      persistent: true
  generate-pwa-assets:
    command: yarn generate-pwa-assets
    deps:
    - assets-sync
inheritedBy:
  tag: pwa
