$schema: https://moonrepo.dev/schemas/tasks.json
# Tasks of the Symfony APIs that only run in GitHub Actions: the checks run
# against the test image that ci-test-build-docker-image builds (sources, vendors
# and tools/ baked in), and docker-buildx pushes the production image.
# COMPOSE_FILE loads compose.yml alone, as `-f compose.yml` would: the
# compose.override.yml picked up by default swaps in the dev build and its bind
# mounts. A task that mirrors a local one of tag-symfony.yml extends it rather
# than repeating its command.
inheritedBy:
  language: php
  layer: application
  stack: backend
tasks:
  ci-check-vulnerabilities:
    command: docker compose -p $project run --rm api ./local-php-security-checker
    env: &ci-compose
      COMPOSE_FILE: compose.yml
  ci-copy-packages:
    script: cp -R $workspaceRoot/libs/php $projectRoot/packages && find $projectRoot/packages -name "moon.yml" -type f -delete
  ci-create-db:
    # --entrypoint php skips the image entrypoint, which otherwise blocks waiting
    # for the (not-yet-created) test database. doctrine:database:create connects
    # to the server's maintenance database and creates app_test (the test env
    # appends the _test suffix). Replaces the POSTGRES_DB override that the
    # removed compose.ci.yml used to provide.
    command: docker compose -p $project run --rm --entrypoint php api bin/console doctrine:database:create -n --if-not-exists
    env: *ci-compose
  ci-export-openapi:
    extends: export-openapi
    deps:
      - ci-create-db
    env: *ci-compose
  ci-php-cs-fixer:
    # Rules and paths come from .php-cs-fixer.php only, as in php-cs-fixer-fix.
    command: docker compose -p $project run --rm api tools/vendor/bin/php-cs-fixer check --diff --show-progress=none
    env: *ci-compose
  ci-phpstan:
    # tools/ is baked into the test image: drop phpstan's install-tools, which
    # would only install it into a throwaway container.
    extends: phpstan
    deps: []
    env: *ci-compose
    options:
      mergeDeps: replace
  ci-test-build-docker-image:
    command: docker build $projectRoot --build-arg BUILDKIT_INLINE_CACHE=1 --cache-from ${TEST_IMAGE_NAME}:latest --tag ${TEST_IMAGE_NAME}:${GITHUB_SHA} --tag ${TEST_IMAGE_NAME}:latest --target frankenphp_test
    deps:
      - ci-copy-packages
  ci-test-phpunit:
    extends: test-phpunit
    deps:
      - ci-create-db
    env: *ci-compose
  ci-update-db:
    command: docker compose -p $project run --rm api bin/console doctrine:schema:update --force
    env: *ci-compose
  ci-validate-db-schema:
    command: docker compose -p $project run --rm api bin/console doctrine:schema:validate -n
    deps:
      - ci-create-db
    env: *ci-compose
  docker-buildx:
    # The layer cache lives in its own registry tag (:buildcache), exported with
    # mode=max so the PHP extension builds of every stage are reused — including
    # the arm64 ones compiled under QEMU, the slow part of this build. Pushing an
    # image does not export any cache by itself: `--cache-from :latest` alone
    # never hit.
    command: docker buildx build $projectRoot --cache-from type=registry,ref=${IMAGE_NAME}:buildcache --cache-to type=registry,ref=${IMAGE_NAME}:buildcache,mode=max --platform linux/arm64,linux/amd64 --target frankenphp_prod --build-arg GIT_SHA=${GITHUB_SHA} -t ${IMAGE_NAME}:latest -t ${IMAGE_NAME}:${GITHUB_SHA} --push
    deps:
      - ci-copy-packages
    env:
      IMAGE_NAME: ghcr.io/lychen-lab/lychen/$project
    options:
      cache: false
