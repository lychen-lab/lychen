$schema: https://moonrepo.dev/schemas/tasks.json
# What the Symfony APIs' tasks (tag-symfony.yml) need on a CI runner, which has
# no dev container: the test image, and the test database its entrypoint waits
# for. The QG workflow sets COMPOSE_FILE=compose.yml, so `docker compose run`
# uses that image instead of the dev build.
#
# The tasks of tag-symfony.yml stay as they are; this file only adds deps to
# them, under the same ids (moon merges a task defined in several inherited
# files). The ci-* tasks are `runInCI: only`: skipped locally, where those
# tasks still run, in the dev container. Their options are set per task: a
# file-level taskOptions applies to every task of the project, not just these.
inheritedBy:
  # Merged before tag-symfony.yml (500, the default of a tag condition), so that
  # these deps come first: lint runs its deps one at a time, in order, and the
  # image must exist before the others start.
  order: 400
  tag: symfony
tasks:
  ci-create-db:
    # --entrypoint php skips the image entrypoint, which otherwise blocks waiting
    # for the (not-yet-created) test database. doctrine:database:create connects
    # to the server's maintenance database and creates app_test (the test env
    # appends the _test suffix). Replaces the POSTGRES_DB override that the
    # removed compose.ci.yml used to provide.
    command: docker compose -p $project run --rm --entrypoint php api bin/console doctrine:database:create -n --if-not-exists
    deps:
      - ci-test-image
    options: &ci-only
      internal: true
      runInCI: only
  ci-test-image:
    # The test image (sources, dev vendors and tools/ baked in), loaded as
    # `<project>:latest`: the image compose.yml resolves the api service to when
    # IMAGES_PREFIX and IMAGE_TAG are unset. Each CI job builds it from the
    # registry caches: the test stage's own, and the production one for the
    # shared base stage. Exporting the cache needs packages:write, so a job
    # without it still builds.
    command: docker buildx build $projectRoot --target frankenphp_test --load --tag $project:latest --cache-from type=registry,ref=${TEST_IMAGE_NAME}:buildcache --cache-from type=registry,ref=${IMAGE_NAME}:buildcache --cache-to type=registry,ref=${TEST_IMAGE_NAME}:buildcache,mode=max,ignore-error=true
    deps:
      - copy-packages
    env:
      IMAGE_NAME: ghcr.io/lychen-lab/lychen/$project
      TEST_IMAGE_NAME: ghcr.io/lychen-lab/lychen/test/$project
    options:
      <<: *ci-only
      cache: false

  # The tasks of tag-symfony.yml that run in the API's container: in CI they
  # first need the test image, and those that boot Symfony (bin/console,
  # phpunit) its database too.
  audit:
    deps: &image
      - ci-test-image
  export-openapi:
    deps: &image-and-db
      - ci-test-image
      - ci-create-db
  format:
    deps: *image
  install-tools:
    # The test image already has tools/.
    options:
      runInCI: skip
  lint:
    deps: *image
  test-functional:
    deps: *image-and-db
  test-security:
    deps: *image-and-db
  validate-db-schema:
    deps: *image-and-db
