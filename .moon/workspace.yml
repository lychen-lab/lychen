$schema: ./cache/schemas/workspace.json
constraints:
  enforceLayerRelationships: true
generator:
  templates:
  - ./templates
hasher:
  ignorePatterns:
  - '**/*.png'
  - '**/*.webp'
  - '**/*.webm'
  - '**/*.jpg'
  - '**/*.jpeg'
  - '**/*.ttf'
  - '**/vendor/**/*'
  - '**/public/bundles/**/*'
  - '**/bin/**/*'
  - '**/var/**/*'
  walkStrategy: glob
projects:
- libs/**/*/moon.yml
- projects/**/*/moon.yml
vcs:
  client: git
  defaultBranch: main
  hooks:
    pre-commit:
    - bash .moon/scripts/pre-commit-fix.sh
  sync: true
