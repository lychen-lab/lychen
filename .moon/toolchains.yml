$schema: ./cache/schemas/toolchain.json
composer:
  pathRepositorySymlink: false
  pathRepositoryUrl: ../packages/*
  plugin: https://github.com/nathan-de-pachtere/moon-composer-toolchain/releases/download/v0.1.0/composer_toolchain.wasm
javascript:
  dedupeOnLockfileChange: true
  inferTasksFromScripts: false
  packageManager: yarn
  syncPackageManagerField: true
  syncProjectWorkspaceDependencies: true
node: {}
typescript:
  createMissingConfig: true
  includeProjectReferenceSources: false
  includeSharedTypes: false
  routeOutDirToCache: true
  syncProjectReferences: true
  syncProjectReferencesToPaths: false
yarn: {}
