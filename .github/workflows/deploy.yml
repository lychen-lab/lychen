name: 'Deploy | Staging'

# Continuous delivery of `main` to staging: build & push the affected images, then
# deploy the affected projects. Both live in ONE workflow so that a failed or
# timed-out build turns this run red, instead of silently stopping the chain
# between two workflows (a cancelled `workflow_run` trigger deployed nothing and
# reported nothing).
#
# - Affected projects are computed against the last commit this workflow fully
#   delivered, not against the previous commit: a failed, cancelled or superseded
#   run never drops a change, the next run picks it up.
# - A failed build only blocks its own project: the others still deploy, and the
#   failed project's deploy refuses to pin a tag that was never pushed.

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/lychen-lab/lychen/

on:
  push:
    branches:
      - main
    paths:
      - 'libs/**'
      - 'projects/**'
      - 'yarn.lock'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a delivery half-way through its deploys. A newer push queues
  # instead; since affected projects are computed from the last delivered commit,
  # the queued run also covers the commits of any run it supersedes.
  cancel-in-progress: false

jobs:
  define-matrix:
    name: 'Gather affected projects'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # this workflow's run history, to find the last delivered commit
    outputs:
      build: ${{ steps.build.outputs.projects }}
      deploy: ${{ steps.deploy.outputs.projects }}
      staging: ${{ steps.environments.outputs.staging }}
    steps:
      - uses: 'actions/checkout@v4'
        with:
          fetch-depth: 0
      - name: Set up Moon Toolchain
        uses: 'moonrepo/setup-toolchain@v0'
      - id: base
        name: 'Find the last delivered commit'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE=$(gh run list --workflow deploy.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          if [[ -n "$BASE" ]] && git merge-base --is-ancestor "$BASE" HEAD; then
            echo "Projects affected since the last delivered commit: $BASE"
            echo "sha=$BASE" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=No delivered commit::No successful run of this workflow in the history of HEAD, every project is considered affected."
          fi
      - id: build
        uses: ./.github/actions/moon-affected-projects-list
        with:
          layer: application
          tasks: docker-buildx
          affected: ${{ steps.base.outputs.sha != '' }}
          base: ${{ steps.base.outputs.sha }}
      - id: deploy
        uses: ./.github/actions/moon-affected-projects-list
        with:
          layer: application
          tags: dokploy
          affected: ${{ steps.base.outputs.sha != '' }}
          base: ${{ steps.base.outputs.sha }}
      - id: environments
        name: 'Check the staging environment exists'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STAGING=$(gh api repos/${{ github.repository }}/environments --jq 'any(.environments[]; .name == "staging")')
          echo "staging=$STAGING" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: 'Build & push image'
    needs: define-matrix
    if: ${{ needs.define-matrix.outputs.build != '[]' && needs.define-matrix.outputs.build != '' }}
    runs-on: ubuntu-latest
    # An API image takes ~25 min from a cold layer cache (arm64 runs under QEMU),
    # a few minutes from a warm one. Fail long before GitHub's 6 h limit, which
    # cancels the job instead of failing it.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.define-matrix.outputs.build) }}
    steps:
      - uses: 'actions/checkout@v4'
        with:
          fetch-depth: 0

      - name: Set up Moon Toolchain
        uses: 'moonrepo/setup-toolchain@v0'

      - name: Install proto tools
        run: proto install

      - name: Enable Corepack
        run: corepack enable

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `moon run`, not `moon ci`: the matrix holds the projects affected since the
      # last delivered commit, and `moon ci` would skip those not touched by the
      # previous commit alone.
      - name: Build and push image
        run: moon run ${{ matrix.project }}:docker-buildx

  deploy-staging:
    name: 'Deploy to staging'
    needs:
      - define-matrix
      - build-and-push
    # Runs even when some builds failed: each project first checks its own image,
    # so the projects that did build still ship while the run turns red.
    if: >-
      ${{ !cancelled() && needs.define-matrix.result == 'success'
      && needs.define-matrix.outputs.staging == 'true'
      && needs.define-matrix.outputs.deploy != '[]' && needs.define-matrix.outputs.deploy != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.define-matrix.outputs.deploy) }}
    env:
      # common-rabbitmq, common-mercure and zitadel run upstream images: nothing to check.
      BUILDS_IMAGE: ${{ contains(fromJSON(needs.define-matrix.outputs.build), matrix.project) }}
    steps:
      - uses: 'actions/checkout@v4'

      - name: Set up Docker Buildx
        if: ${{ env.BUILDS_IMAGE == 'true' }}
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: ${{ env.BUILDS_IMAGE == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Check the image was pushed'
        if: ${{ env.BUILDS_IMAGE == 'true' }}
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}${{ matrix.project }}:${{ github.sha }}
        run: |
          if ! docker buildx imagetools inspect "$IMAGE" > /dev/null; then
            echo "::error title=Image not pushed::$IMAGE does not exist (its build failed or was cancelled), staging stays on its current version."
            exit 1
          fi

      # Calls the script directly rather than `moon ci <project>:dokploy-compose-deploy`:
      # for a frontend, moon would first set up node and run a full `yarn install`
      # just to run this curl script.
      - name: 'Deploy'
        env:
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
          DOKPLOY_API_URL: ${{ secrets.DOKPLOY_API_URL }}
          DOKPLOY_SECRETS: ${{ toJSON(secrets) }}
          PROJECT: ${{ matrix.project }}
          # Written into the Dokploy compose env (IMAGE_TAG) so compose.yml pins
          # `image: …:${IMAGE_TAG}` to the image built above for this commit.
          IMAGE_TAG: ${{ github.sha }}
        run: |
          SECRET_NAME="$(echo "$PROJECT" | tr '[:lower:]-' '[:upper:]_')_DOKPLOY_ID"
          DOKPLOY_COMPOSE_ID=$(jq -r --arg key "$SECRET_NAME" '.[$key] // empty' <<< "$DOKPLOY_SECRETS")
          if [[ -z "$DOKPLOY_COMPOSE_ID" ]]; then
            echo "::error title=Missing secret::$SECRET_NAME is not set in the staging environment."
            exit 1
          fi
          export DOKPLOY_COMPOSE_ID
          bash .moon/scripts/dokploy-compose-deploy.sh
