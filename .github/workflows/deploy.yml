name: 'Deploy'

env:
  REGISTRY: ghcr.io

on:
  workflow_dispatch: {}
  workflow_run:
    workflows: 
      - Build and push images
    types:
      - completed
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  
jobs:
  on-failure:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - run: echo 'The triggering workflow failed'

  define-matrix:
    name: 'Gather affected projects & environments'
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.gather-projects.outputs.projects }}
      environments: ${{ steps.fetch-environments.outputs.environments }}
    steps:
      - uses: 'actions/checkout@v4'
        with:
          fetch-depth: 0
      - name: Set up Moon Toolchain
        uses: 'moonrepo/setup-toolchain@v0'
      - id: gather-projects
        uses: ./.github/actions/moon-affected-projects-list
        with:
          layer: application
          tags: dokploy
      - id: fetch-environments
        name: Fetch Environments from GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch environments and extract names into a JSON array
          ENVS=$(gh api repos/${{ github.repository }}/environments --jq '[.environments[].name]')
          echo "environments=$ENVS" >> $GITHUB_OUTPUT
  
  deploy-staging:
    if: ${{ needs.define-matrix.outputs.projects != '[]' && needs.define-matrix.outputs.projects != '' && contains(fromJSON(needs.define-matrix.outputs.environments), 'staging') }}
    name: 'Deployment to staging'
    runs-on: ubuntu-latest
    needs:
      - define-matrix
    strategy:
      fail-fast: false
      matrix:
        projects: ${{ fromJSON(needs.define-matrix.outputs.projects) }}
    environment: staging
    steps:
      - uses: 'actions/checkout@v4'
        with:
          fetch-depth: 0
      - name: Set up Moon Toolchain
        uses: 'moonrepo/setup-toolchain@v0'
      - name: Enable Corepack
        run: corepack enable
      - name: 'Deploy'
        env:
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
          DOKPLOY_API_URL: ${{ secrets.DOKPLOY_API_URL }}
          DOKPLOY_SECRETS: ${{ toJSON(secrets) }}
          # The image tag built by "Build and push images" for this commit.
          # The deploy script writes it into the Dokploy compose env (IMAGE_TAG)
          # so compose.yml pins `image: …:${IMAGE_TAG}` to this exact build.
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          PROJECT_ID_UPPERCASE=$(echo "${{ matrix.projects }}" | tr '[:lower:]-' '[:upper:]_')
          SECRET_NAME="${PROJECT_ID_UPPERCASE}_DOKPLOY_ID"
          export DOKPLOY_COMPOSE_ID=$(echo "$DOKPLOY_SECRETS" | jq -r --arg key "$SECRET_NAME" '.[$key]')
          moon ci ${{ matrix.projects }}:dokploy-compose-deploy

  deploy-production:
    if: ${{ needs.define-matrix.outputs.projects != '[]' && needs.define-matrix.outputs.projects != '' && contains(fromJSON(needs.define-matrix.outputs.environments), 'production') }}
    name: 'Deployment to production'
    runs-on: ubuntu-latest
    needs:
      - define-matrix
      - deploy-staging
    strategy:
      fail-fast: false
      matrix:
        projects: ${{ fromJSON(needs.define-matrix.outputs.projects) }}
    environment: production
    steps:
      - uses: 'actions/checkout@v4'
        with:
          fetch-depth: 0
      - name: Set up Moon Toolchain
        uses: 'moonrepo/setup-toolchain@v0'
      - name: Enable Corepack
        run: corepack enable
      - name: 'Deploy'
        env:
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
          DOKPLOY_API_URL: ${{ secrets.DOKPLOY_API_URL }}
          DOKPLOY_SECRETS: ${{ toJSON(secrets) }}
          # The image tag built by "Build and push images" for this commit.
          # The deploy script writes it into the Dokploy compose env (IMAGE_TAG)
          # so compose.yml pins `image: …:${IMAGE_TAG}` to this exact build.
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          PROJECT_ID_UPPERCASE=$(echo "${{ matrix.projects }}" | tr '[:lower:]-' '[:upper:]_')
          SECRET_NAME="${PROJECT_ID_UPPERCASE}_DOKPLOY_ID"
          export DOKPLOY_COMPOSE_ID=$(echo "$DOKPLOY_SECRETS" | jq -r --arg key "$SECRET_NAME" '.[$key]')
          moon ci ${{ matrix.projects }}:dokploy-compose-deploy