name: 'Frontend | Static checks'

# Static quality gate for the frontend: lint & format, typecheck, and the
# Docker build of affected apps — grouped into one workflow so a PR shows a
# single "static checks" entry. Unit tests live in their own workflow
# (Frontend | Tests) because they grow per app and are run/iterated separately.

env:
  REGISTRY: ghcr.io

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: 'Lint & Format affected projects'
    runs-on: ubuntu-latest
    steps:
      - uses: 'actions/checkout@v4'
        with:
          fetch-depth: 0

      - name: Set up Moon Toolchain
        uses: 'moonrepo/setup-toolchain@v0'

      - name: Install proto tools
        run: proto install

      - name: Enable Corepack
        run: corepack enable

      - name: Lint and check formatting
        run: moon ci :lint :format

  typecheck:
    name: 'Typecheck'
    runs-on: ubuntu-latest
    steps:
      - uses: 'actions/checkout@v4'
        with:
          fetch-depth: 0

      - name: Set up Moon Toolchain
        uses: 'moonrepo/setup-toolchain@v0'

      - name: Install proto tools
        run: proto install

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Typecheck
        run: 'moon ci :typecheck'

  define-matrix:
    name: 'Gather affected projects'
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.gather-projects.outputs.projects }}
    steps:
      - uses: 'actions/checkout@v4'
        with:
          fetch-depth: 0
      - name: Set up Moon Toolchain
        uses: 'moonrepo/setup-toolchain@v0'
      - id: gather-projects
        uses: ./.github/actions/moon-affected-projects-list
        with:
          layer: application
          tags: docker

  build:
    if: ${{ needs.define-matrix.outputs.projects != '[]' && needs.define-matrix.outputs.projects != '' }}
    name: 'Build image'
    needs: define-matrix
    strategy:
      fail-fast: false
      matrix:
        projects: ${{ fromJSON(needs.define-matrix.outputs.projects) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: 'actions/checkout@v4'
        with:
          fetch-depth: 0

      - name: Set up Moon Toolchain
        uses: 'moonrepo/setup-toolchain@v0'

      - name: Install proto tools
        run: proto install

      - name: Enable Corepack
        run: corepack enable

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build docker images
        run: 'moon ci ${{ matrix.projects }}:docker-test-build'
