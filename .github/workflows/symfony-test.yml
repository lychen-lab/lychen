name: 'Symfony | Tests'

env:
  REGISTRY: ghcr.io/lychen-lab/lychen/test
  # Make the compose-based CI tasks resolve the `api` service to the test image
  # that build-and-push-test-image pushes to ghcr (vendors are baked in).
  IMAGES_PREFIX: ghcr.io/lychen-lab/lychen/test/
  IMAGE_TAG: ${{ github.sha }}

on:
  # No `paths:` filter: "Symfony | Gate" is a required check, so it must report on
  # every PR. Without an affected API, define-matrix returns an empty list and the
  # other jobs are skipped in seconds.
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  define-matrix:
    name: 'Gather affected projects'
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.gather-projects.outputs.projects }}
    steps:
      - uses: 'actions/checkout@v4'
        with:
          fetch-depth: 0
      - name: Set up Moon Toolchain
        uses: 'moonrepo/setup-toolchain@v0'
      - id: gather-projects
        uses: ./.github/actions/moon-affected-projects-list
        with:
          layer: application
          tags: symfony
          # The PR's base branch, which `moon ci` compares against in the jobs
          # below. Without it this compares against main: a stacked PR then lists
          # projects that `moon ci` skips as unaffected, and their jobs fail on
          # work that never ran (e.g. pushing a test image that was never built).
          base: ${{ github.base_ref }}

  build-and-push-test-image:
    if: ${{ needs.define-matrix.outputs.projects != '[]' && needs.define-matrix.outputs.projects != '' }}
    name: '${{ matrix.projects }} | Build docker test image'
    needs: define-matrix
    strategy:
      fail-fast: false
      matrix:
        projects: ${{ fromJSON(needs.define-matrix.outputs.projects) }}
    outputs:
      matrix_test_image_name: ${{ steps.set-image.outputs.matrix_test_image_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: 'actions/checkout@v4'
        with:
          fetch-depth: 0

      - name: Set up Moon Toolchain
        uses: 'moonrepo/setup-toolchain@v0'
        with:
          auto-install: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate IMAGE_NAME
        id: set-image
        run: |
          # Set for current job
          echo "TEST_IMAGE_NAME=${{ env.REGISTRY }}/${{ matrix.projects }}" >> $GITHUB_ENV
          # Set for other jobs
          echo "matrix_test_image_name=${{ env.REGISTRY }}/${{ matrix.projects }}" >> $GITHUB_OUTPUT

      - name: Pull test image if exists
        run: docker pull ${{ env.TEST_IMAGE_NAME }}:latest || true

      # The test image now bakes in the project sources and Composer vendors
      # (dev dependencies included). ci-test-build-docker-image depends on
      # ci-copy-packages, so the lychen/* path packages are copied in beforehand.
      - name: Build docker test image
        run: moon ci ${{ matrix.projects }}:ci-test-build-docker-image

      - name: Push docker test image
        run: |
          docker push ${{ env.TEST_IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.TEST_IMAGE_NAME }}:latest

  lint-php:
    name: '${{ matrix.projects }} | Lint PHP files'
    needs:
      - define-matrix
      - build-and-push-test-image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        projects: ${{ fromJSON(needs.define-matrix.outputs.projects) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Moon Toolchain
        uses: 'moonrepo/setup-toolchain@v0'

      - name: Set IMAGE_NAME for this project
        run: echo "TEST_IMAGE_NAME=${{ needs.build-and-push-test-image.outputs.matrix_test_image_name }}" >> $GITHUB_ENV

      - name: Check the code style
        run: moon ci ${{ matrix.projects }}:ci-php-cs-fixer

  check-vulnerabilities:
    name: '${{ matrix.projects }} | Check packages vulnerabilities'
    needs:
      - define-matrix
      - build-and-push-test-image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        projects: ${{ fromJSON(needs.define-matrix.outputs.projects) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Moon Toolchain
        uses: 'moonrepo/setup-toolchain@v0'

      - name: Set IMAGE_NAME for this project
        run: echo "TEST_IMAGE_NAME=${{ needs.build-and-push-test-image.outputs.matrix_test_image_name }}" >> $GITHUB_ENV

      - name: Check vulnerabilities
        run: moon ci ${{ matrix.projects }}:ci-check-vulnerabilities

  validate-db-schema:
    name: '${{ matrix.projects }} | Validate DB schema'
    needs:
      - define-matrix
      - build-and-push-test-image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        projects: ${{ fromJSON(needs.define-matrix.outputs.projects) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Moon Toolchain
        uses: 'moonrepo/setup-toolchain@v0'

      - name: Set IMAGE_NAME for this project
        run: echo "TEST_IMAGE_NAME=${{ needs.build-and-push-test-image.outputs.matrix_test_image_name }}" >> $GITHUB_ENV

      - name: Validate DB
        run: moon ci ${{ matrix.projects }}:ci-validate-db-schema

  phpstan:
    name: '${{ matrix.projects }} | PHPStan'
    needs:
      - define-matrix
      - build-and-push-test-image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        projects: ${{ fromJSON(needs.define-matrix.outputs.projects) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Moon Toolchain
        uses: 'moonrepo/setup-toolchain@v0'

      - name: Set IMAGE_NAME for this project
        run: echo "TEST_IMAGE_NAME=${{ needs.build-and-push-test-image.outputs.matrix_test_image_name }}" >> $GITHUB_ENV

      # The baseline is frozen debt: it may shrink, never grow. Regenerating it to
      # absorb new errors would hide them, so a PR that adds entries fails here.
      - name: Check the PHPStan baseline did not grow
        if: ${{ github.base_ref != '' }}
        run: |
          BASELINE="$(moon project ${{ matrix.projects }} --json | jq -r '.source')/phpstan-baseline.neon"
          total() { grep -E '^[[:space:]]+count: [0-9]+$' | awk '{ s += $2 } END { print s + 0 }'; }
          if ! git cat-file -e "origin/${{ github.base_ref }}:$BASELINE" 2> /dev/null; then
            echo "No baseline on ${{ github.base_ref }} yet, nothing to compare."
            exit 0
          fi
          BEFORE=$(git show "origin/${{ github.base_ref }}:$BASELINE" | total)
          AFTER=$(total < "$BASELINE")
          echo "Baselined errors: $BEFORE on ${{ github.base_ref }}, $AFTER on this PR."
          if (( AFTER > BEFORE )); then
            echo "::error title=PHPStan baseline grew::$BASELINE went from $BEFORE to $AFTER errors. Fix the new errors instead of baselining them."
            exit 1
          fi

      - name: Run PHPStan
        run: moon ci ${{ matrix.projects }}:ci-phpstan

  phpunit-security:
    name: '${{ matrix.projects }} | Security PHPUnit'
    needs:
      - define-matrix
      - build-and-push-test-image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        projects: ${{ fromJSON(needs.define-matrix.outputs.projects) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set IMAGE_NAME for this project
        run: echo "TEST_IMAGE_NAME=${{ needs.build-and-push-test-image.outputs.matrix_test_image_name }}" >> $GITHUB_ENV

      - name: Set up Moon Toolchain
        uses: 'moonrepo/setup-toolchain@v0'

      - name: Security tests
        run: moon run ${{ matrix.projects }}:ci-test-phpunit -- tests/Security

  phpunit-functional:
    name: '${{ matrix.projects }} | Functional PHPUnit'
    needs:
      - define-matrix
      - build-and-push-test-image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        projects: ${{ fromJSON(needs.define-matrix.outputs.projects) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set IMAGE_NAME for this project
        run: echo "TEST_IMAGE_NAME=${{ needs.build-and-push-test-image.outputs.matrix_test_image_name }}" >> $GITHUB_ENV

      - name: Set up Moon Toolchain
        uses: 'moonrepo/setup-toolchain@v0'

      - name: Functional tests
        run: moon run ${{ matrix.projects }}:ci-test-phpunit -- tests/Functional

  # The one required check of this workflow (branch ruleset). It fails when a job
  # failed or was cancelled and, as soon as an API is affected, when a job was
  # skipped: a check disabled with `if: false` turns the gate red instead of
  # silently disappearing from the PR.
  gate:
    name: 'Symfony | Gate'
    if: ${{ always() }}
    needs:
      - define-matrix
      - build-and-push-test-image
      - lint-php
      - check-vulnerabilities
      - validate-db-schema
      - phpstan
      - phpunit-security
      - phpunit-functional
    runs-on: ubuntu-latest
    steps:
      - name: 'Check every job passed'
        env:
          NEEDS: ${{ toJSON(needs) }}
          AFFECTED: ${{ needs.define-matrix.outputs.projects }}
        run: |
          ok='["success"]'
          # No affected API: the matrix jobs are skipped on purpose.
          if [[ -z "$AFFECTED" || "$AFFECTED" == "[]" ]]; then ok='["success","skipped"]'; fi
          bad=$(jq -r --argjson ok "$ok" 'to_entries[] | select(.value.result | IN($ok[]) | not) | "\(.key)=\(.value.result)"' <<< "$NEEDS")
          if [[ -n "$bad" ]]; then
            echo "::error title=Symfony checks not green::$(paste -sd ' ' - <<< "$bad")"
            exit 1
          fi
