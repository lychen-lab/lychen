name: 'Helm | Production'

# The Kubernetes counterpart of Deploy | Production: manual, release-gated.
# Helm | Release published every project's chart as version X.Y.Z, pinned to the
# vX.Y.Z image; run THIS workflow to `helm upgrade` the `kubernetes-production`
# environment to it. Rollback = run it with an older version (or `helm rollback`).
#
# A project whose vX.Y.Z image is the one already running keeps its pods, which
# Deploy | Production gets by skipping the deploy: here the image is pinned by
# digest and the pod template carries no version label, so only a new image or
# new configuration rolls them.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to deploy, e.g. v0.2.0 (blank = latest release tag)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/lychen-lab/lychen/

jobs:
  define-matrix:
    name: 'Resolve version & projects'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      projects: ${{ steps.charts.outputs.projects }}
      version: ${{ steps.resolve-version.outputs.version }}
    steps:
      - uses: 'actions/checkout@v4'
        with:
          fetch-depth: 0
      - name: Set up Moon Toolchain
        uses: 'moonrepo/setup-toolchain@v0'
      - id: resolve-version
        name: 'Resolve version'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ -z "$VERSION" ]]; then
            VERSION="$(git describe --tags --match 'v*' --abbrev=0)"
          fi
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Not a release::'$VERSION' is not a vX.Y.Z release tag."
            exit 1
          fi
          echo "Deploying production version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      # affected:false → every project with a chart: a release deploys the whole
      # set at one coherent version.
      - id: charts
        uses: ./.github/actions/moon-affected-projects-list
        with:
          tags: helm
          affected: 'false'

  deploy:
    name: 'Deploy to Kubernetes production'
    needs: define-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: kubernetes-production
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.define-matrix.outputs.projects) }}
    env:
      VERSION: ${{ needs.define-matrix.outputs.version }}
    steps:
      - uses: 'actions/checkout@v4'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Helm
        uses: ./.github/actions/helm
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # The digest of the multi-platform index, which every node resolves to its
      # own platform. Release's promote-images creates the tag: until it did, the
      # deploy refuses rather than pin an image that does not exist.
      - id: image
        name: 'Resolve the image digest'
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}${{ matrix.project }}:${{ env.VERSION }}
        run: |
          if ! DIGEST=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' | jq -re .digest); then
            echo "::error title=Image not promoted::$IMAGE does not exist: check that Release promoted the images of $VERSION."
            exit 1
          fi
          echo "$IMAGE is $DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: 'Write the kubeconfig'
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          if [[ -z "$KUBECONFIG_CONTENT" ]]; then
            echo "::error title=Missing secret::KUBECONFIG is not set in the kubernetes-production environment."
            exit 1
          fi
          install -m 600 /dev/null "$RUNNER_TEMP/kubeconfig"
          printf '%s\n' "$KUBECONFIG_CONTENT" > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: 'Deploy'
        env:
          VARS: ${{ toJSON(vars) }}
          PROJECT: ${{ matrix.project }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          HELM_NAMESPACE: ${{ vars.KUBERNETES_NAMESPACE }}
        run: |
          VALUES_VAR="$(echo "$PROJECT" | tr '[:lower:]-' '[:upper:]_')_HELM_VALUES"
          HELM_VALUES=$(jq -r --arg key "$VALUES_VAR" '.[$key] // empty' <<< "$VARS")
          if [[ -z "$HELM_VALUES" ]]; then
            echo "::error title=Missing variable::$VALUES_VAR is not set in the kubernetes-production environment."
            exit 1
          fi
          export HELM_VALUES
          CHART_VERSION="${VERSION#v}" bash .moon/scripts/helm-deploy.sh
