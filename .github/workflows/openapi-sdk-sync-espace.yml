name: 'OpenAPI | SDK sync (espace)'

# Reports, without failing, the drift between espace-api and its committed spec
# and SDK (libs/typescript/espace-api-sdk): see openapi-sdk-sync.yml.

on:
  pull_request:
    paths:
      - 'projects/espace/api/**'
      - 'libs/php/**'
      # The SDK and the generator's configuration.
      - 'libs/typescript/espace-api-sdk/**'
      - 'libs/typescript/api-sdk-config/**'
      - '.moon/tasks/tag-api-sdk.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-sync:
    uses: ./.github/workflows/openapi-sdk-sync.yml
    with:
      api: espace
