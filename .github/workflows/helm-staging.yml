name: 'Helm | Staging'

# The Kubernetes counterpart of Deploy | Staging, for the projects that have a
# Helm chart (tag `helm`). It starts once Deploy | Staging has pushed the
# commit's images, and leaves that workflow, and Dokploy, untouched:
#
# 1. CI — package each project's chart pinned to the image built for this
#    commit, and push it to oci://ghcr.io/lychen-lab/lychen/charts/<project>, as
#    version 0.0.0-g<sha>.
# 2. CD — `helm upgrade` the `kubernetes-staging` environment to those charts.
#    Skipped while that GitHub Environment does not exist: the charts are
#    published all the same.
#
# Only the projects whose image was pushed for this commit get a chart: Deploy |
# Staging only builds the affected projects, and a chart must never pin an image
# that does not exist. A project whose build failed is caught up by the next
# delivery, which rebuilds it.
#
# See docs/kubernetes.md.

env:
  IMAGE_PREFIX: ghcr.io/lychen-lab/lychen/
  # The commit Deploy | Staging delivered, or the dispatched one.
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

on:
  workflow_run:
    workflows:
      - 'Deploy | Staging'
    types:
      - completed
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}
  # Never cancel a deploy half-way through, as Deploy | Staging.
  cancel-in-progress: false

jobs:
  define-matrix:
    name: 'Gather built projects'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      projects: ${{ steps.built.outputs.projects }}
      kubernetes: ${{ steps.environments.outputs.kubernetes }}
    steps:
      - uses: 'actions/checkout@v4'
        with:
          ref: ${{ env.SHA }}

      - name: Set up Moon Toolchain
        uses: 'moonrepo/setup-toolchain@v0'

      - id: charts
        uses: ./.github/actions/moon-affected-projects-list
        with:
          tags: helm
          affected: 'false'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: built
        name: 'Keep the projects whose image was pushed'
        env:
          PROJECTS: ${{ steps.charts.outputs.projects }}
        run: |
          BUILT='[]'
          for PROJECT in $(jq -r '.[]' <<< "$PROJECTS"); do
            if docker buildx imagetools inspect "${IMAGE_PREFIX}${PROJECT}:${SHA}" > /dev/null 2>&1; then
              BUILT=$(jq -c --arg project "$PROJECT" '. + [$project]' <<< "$BUILT")
            fi
          done
          echo "Projects built for ${SHA}: ${BUILT}"
          echo "projects=${BUILT}" >> "$GITHUB_OUTPUT"

      - id: environments
        name: 'Check the kubernetes-staging environment exists'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KUBERNETES=$(gh api repos/${{ github.repository }}/environments --jq 'any(.environments[]; .name == "kubernetes-staging")')
          echo "kubernetes=$KUBERNETES" >> "$GITHUB_OUTPUT"

  chart:
    name: 'Package & push chart'
    needs: define-matrix
    if: ${{ needs.define-matrix.outputs.projects != '[]' && needs.define-matrix.outputs.projects != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.define-matrix.outputs.projects) }}
    steps:
      - uses: 'actions/checkout@v4'
        with:
          ref: ${{ env.SHA }}

      - name: Set up Moon Toolchain
        uses: 'moonrepo/setup-toolchain@v0'

      - name: Set up Helm
        uses: ./.github/actions/helm
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # The helm tasks run on the system toolchain: no node, no yarn install.
      - name: Package and push chart
        env:
          IMAGE_TAG: ${{ env.SHA }}
          CHART_VERSION: 0.0.0-g${{ env.SHA }}
        run: moon run ${{ matrix.project }}:helm-push

  deploy:
    name: 'Deploy to Kubernetes staging'
    needs:
      - define-matrix
      - chart
    # Runs even when some charts failed to push: those projects fail on their own
    # (chart not found) while the others still ship.
    if: >-
      ${{ !cancelled() && needs.define-matrix.result == 'success'
      && needs.define-matrix.outputs.kubernetes == 'true'
      && needs.define-matrix.outputs.projects != '[]' && needs.define-matrix.outputs.projects != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: kubernetes-staging
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.define-matrix.outputs.projects) }}
    steps:
      - uses: 'actions/checkout@v4'
        with:
          ref: ${{ env.SHA }}

      - name: Set up Helm
        uses: ./.github/actions/helm
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Write the kubeconfig'
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          if [[ -z "$KUBECONFIG_CONTENT" ]]; then
            echo "::error title=Missing secret::KUBECONFIG is not set in the kubernetes-staging environment."
            exit 1
          fi
          install -m 600 /dev/null "$RUNNER_TEMP/kubeconfig"
          printf '%s\n' "$KUBECONFIG_CONTENT" > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      # The environment's values for the project live in its <PROJECT>_HELM_VALUES
      # variable (e.g. ESPACE_APP_HELM_VALUES), as its Dokploy compose id lives in
      # <PROJECT>_DOKPLOY_ID: hosts and plain configuration, never secrets.
      - name: 'Deploy'
        env:
          VARS: ${{ toJSON(vars) }}
          PROJECT: ${{ matrix.project }}
          CHART_VERSION: 0.0.0-g${{ env.SHA }}
          HELM_NAMESPACE: ${{ vars.KUBERNETES_NAMESPACE }}
        run: |
          VALUES_VAR="$(echo "$PROJECT" | tr '[:lower:]-' '[:upper:]_')_HELM_VALUES"
          HELM_VALUES=$(jq -r --arg key "$VALUES_VAR" '.[$key] // empty' <<< "$VARS")
          if [[ -z "$HELM_VALUES" ]]; then
            echo "::error title=Missing variable::$VALUES_VAR is not set in the kubernetes-staging environment."
            exit 1
          fi
          export HELM_VALUES
          bash .moon/scripts/helm-deploy.sh
