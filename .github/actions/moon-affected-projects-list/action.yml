name: List moon affected projects to GITHUB_OUPUT
description: 'Use moon query to fetch list of affected project id'
inputs:
  layer:
    description: 'Targeted layer'
    required: false
    default: 'application'
  stack:
    description: 'Targeted stack'
    required: false
outputs:
  projects: 
    description: "Projects list"
    value: ${{ steps.list.outputs.projects }}
runs:
  using: "composite"
  steps:
    - run: moon query projects --affected --downstream deep --layer ${{ inputs.layer }} --stack ${{ inputs.stack }}
      shell: bash

    - name: Define Projects
      shell: bash
      id: list
      run: |
          echo "projects=$(moon query projects --affected --downstream deep --layer ${{ inputs.layer }} --stack ${{ inputs.stack }} --json | jq -r '.projects | map(.id | @json) | join(",")' | sed 's/^/\[/; s/$/\]/')" >> "$GITHUB_OUTPUT"
          
    - run: echo ${{ steps.list.outputs.projects }}
      shell: bash

