# https://moonrepo.dev/docs/config/template
$schema: '../../.moon/cache/schemas/template.json'

description: |
  Scaffolds one resource of an API's front libs (`moon generate api-front`): its model in
  libs/typescript/<api>-models, and in libs/vue/<api>-api/endpoint/<resource>/ its query
  keys, its mapper and one Tanstack Query composable per endpoint (get one, get a page,
  create, update, delete). Then complete every TODO, the model's fields and the mapper's:
  the type check lists what a POST body still misses, not what a PATCH does. Delete the
  composables of the endpoints the API does not have, and run `moon run :format-fix` (the
  commit hook formats too: line breaks depend on the names).
destination: '/'
title: 'API endpoint'
variables:
  api:
    default: ''
    prompt: 'API name, in kebab-case? (e.g. flora)'
    required: true
    type: 'string'
  id:
    default: 'uuid'
    prompt: 'Name of its identifier? (uuid, ulid…)'
    type: 'string'
  resource:
    default: ''
    prompt: 'Resource name, singular, in kebab-case? (e.g. seed-library)'
    required: true
    type: 'string'
  resources:
    default: ''
    prompt: 'The same, plural, as in the API paths? (e.g. seed-libraries for /api/seed_libraries)'
    required: true
    type: 'string'
