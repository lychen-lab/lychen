# https://moonrepo.dev/docs/config/template
$schema: '../../.moon/cache/schemas/template.json'

description: |
  Scaffolds one endpoint composable of an API's front lib (`moon generate api-front`), for
  any operation of its SDK: a read (`…Get`), a page of a list (`…GetCollection`), a deletion
  (`…Delete`), or any other write, workflow transitions and custom actions included. It
  writes libs/vue/<api>-api/endpoint/<resource>/use<Name>.ts, with its own mapping
  (mapToRequest, mapToModel) to TODO, and the resource's queryKeys.ts. The front model it
  gives (--model, in libs/typescript/<api>-models) is the front's: write it first, it need
  not follow the API's representation. Then complete the TODOs until the lib's typecheck
  passes; the commit hook formats.
destination: '/'
title: 'API endpoint composable'
variables:
  api:
    default: ''
    prompt: 'API name, in kebab-case? (e.g. flora)'
    required: true
    type: 'string'
  file:
    default: ''
    prompt: 'The models file that exports it, when not named after it? (e.g. Land for LandSummary)'
    type: 'string'
  model:
    default: ''
    prompt: 'The front model it gives, from libs/typescript/<api>-models? (e.g. SeedLot; ignored for a deletion)'
    required: true
    type: 'string'
  name:
    default: ''
    prompt: 'Composable name without "use", in kebab-case? (e.g. give-seed-lot)'
    required: true
    type: 'string'
  operation:
    default: ''
    prompt: 'The SDK operation it calls? (e.g. apiSeedLotsUuidgivePatch)'
    required: true
    type: 'string'
  resource:
    default: ''
    prompt: 'The resource it belongs to, in kebab-case: its folder and cache keys? (e.g. seed-lot)'
    required: true
    type: 'string'
