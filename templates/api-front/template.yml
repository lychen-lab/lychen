# https://moonrepo.dev/docs/config/template
$schema: '../../.moon/cache/schemas/template.json'

description: |
  Scaffolds how the frontends reach an API whose SDK exists (libs/typescript/<api>-api-sdk,
  `moon generate api-sdk`): libs/vue/<api>-api, its client, where `moon generate
  api-endpoint` then adds one composable per endpoint; and libs/typescript/<api>-models,
  the front's models, with a first one (--model) to write: the front's own, which need not
  follow the API's representation. Then `yarn install`.
destination: '/'
title: 'API front libs'
variables:
  api:
    default: ''
    prompt: 'API name, in kebab-case? (e.g. flora)'
    required: true
    type: 'string'
  env:
    default: ''
    prompt: 'Env variable of its base URL? (empty for VITE_<API>_API_URL)'
    type: 'string'
  model:
    default: ''
    prompt: 'A first front model, in PascalCase? (e.g. SeedLibrary)'
    required: true
    type: 'string'
