# https://moonrepo.dev/docs/config/template
$schema: '../../.moon/cache/schemas/template.json'

description: 'Scaffolds the initial structure for a Vue library'
destination: 'libs/vue/[name]'
title: 'Vue Library'
variables:
  name:
    default: ''
    prompt: 'Library name ? (without vue-)'
    required: true
    type: 'string'
