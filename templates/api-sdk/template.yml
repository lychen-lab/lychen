# https://moonrepo.dev/docs/config/template
$schema: '../../.moon/cache/schemas/template.json'

description: |
  Scaffolds the TypeScript SDK of an API (libs/typescript/<api>-api-sdk), generated by
  @hey-api/openapi-ts from the shared configuration of libs/typescript/api-sdk-config.
  Without url, the API is the monorepo project <api>-api (projects/<api>/api).
destination: 'libs/typescript/[api]-api-sdk'
title: 'API SDK'
variables:
  api:
    default: ''
    prompt: 'API name, in kebab-case? (e.g. flora)'
    required: true
    type: 'string'
  url:
    default: ''
    prompt: 'URL of its OpenAPI spec? (empty for the monorepo project <api>-api)'
    type: 'string'
